name: Validate

# Every branch here, Renovate's included, is pushed to this repo, so push
# covers pull requests without running twice.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with the Flux controllers on the clusters, which are upgraded
  # by hand.
  FLUX_VERSION: v2.8.8
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: 1.38.0

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yamllint
        run: pipx install "yamllint==${YAMLLINT_VERSION}"
      - name: Lint
        run: yamllint --strict --format github .

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install flux and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/${FLUX_VERSION}/flux_${FLUX_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" flux
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build
        run: scripts/build-manifests.py "$RUNNER_TEMP/manifests"
      # CRD schemas come from the community catalog. A kind with no schema
      # fails rather than being skipped, except CustomResourceDefinition, which
      # neither source publishes one for. Failures are also posted as one
      # annotation, so they show on the run page without opening the log.
      - name: Validate
        run: |
          if kubeconform -strict -summary -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/manifests" > "$RUNNER_TEMP/kubeconform.txt"; then
            cat "$RUNNER_TEMP/kubeconform.txt"
            exit 0
          fi
          cat "$RUNNER_TEMP/kubeconform.txt"
          message=$(grep -v '^Summary:' "$RUNNER_TEMP/kubeconform.txt" \
            | sed "s|$RUNNER_TEMP/manifests/||; s/%/%25/g" | awk '{printf "%s%%0A", $0}')
          echo "::error title=kubeconform::${message}"
          exit 1
