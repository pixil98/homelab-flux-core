apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-recovery
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  recovery.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - Recovery flow
    entries:
      # Cross-blueprint !Find fails if the target does not exist yet
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Custom - Password policies
          required: true

      - model: authentik_flows.flow
        id: recovery_flow
        identifiers: { slug: recovery-flow }
        state: present
        attrs:
          name: Recovery flow
          title: Reset your password
          designation: recovery
          authentication: require_unauthenticated

      - model: authentik_stages_identification.identificationstage
        id: recovery_identification
        identifiers: { name: recovery-identification }
        state: present
        attrs:
          user_fields: [email, username]

      # SMTP comes from AUTHENTIK_EMAIL__* in authentik-env
      - model: authentik_stages_email.emailstage
        id: recovery_email
        identifiers: { name: recovery-email }
        state: present
        attrs:
          use_global_settings: true
          template: email/password_reset.html
          subject: Password reset
          token_expiry: minutes=30
          # Recovery must not reactivate a user that was deliberately disabled
          activate_user_on_success: false

      - model: authentik_stages_prompt.prompt
        id: recovery_field_password
        identifiers: { name: recovery-field-password }
        state: present
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 0

      - model: authentik_stages_prompt.prompt
        id: recovery_field_password_repeat
        identifiers: { name: recovery-field-password-repeat }
        state: present
        attrs:
          field_key: password_repeat
          label: Password (repeat)
          type: password
          required: true
          placeholder: Password (repeat)
          order: 1

      - model: authentik_stages_prompt.promptstage
        id: recovery_prompt
        identifiers: { name: recovery-password-prompt }
        state: present
        attrs:
          fields:
            - !KeyOf recovery_field_password
            - !KeyOf recovery_field_password_repeat
          validation_policies:
            - !Find [authentik_policies_password.passwordpolicy, [name, password-complexity]]
            - !Find [authentik_policies_password.passwordpolicy, [name, password-breached]]

      - model: authentik_stages_user_write.userwritestage
        id: recovery_user_write
        identifiers: { name: recovery-user-write }
        state: present
        attrs:
          user_creation_mode: never_create

      - model: authentik_stages_user_login.userloginstage
        id: recovery_user_login
        identifiers: { name: recovery-user-login }
        state: present

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery_flow
          stage: !KeyOf recovery_identification
          order: 10

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery_flow
          stage: !KeyOf recovery_email
          order: 20

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery_flow
          stage: !KeyOf recovery_prompt
          order: 30

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery_flow
          stage: !KeyOf recovery_user_write
          order: 40

      - model: authentik_flows.flowstagebinding
        identifiers:
          target: !KeyOf recovery_flow
          stage: !KeyOf recovery_user_login
          order: 100
