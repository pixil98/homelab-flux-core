apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-password-policies
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  password_policies.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - Password policies
    entries:
      # Kept separate from the breach check so either can be unbound on its own, and so
      # a password failing both reports both reasons at once.
      - model: authentik_policies_password.passwordpolicy
        identifiers: { name: password-complexity }
        state: present
        attrs:
          check_static_rules: true
          length_min: 12
          check_zxcvbn: true
          zxcvbn_score_threshold: 2
          # passes_static returns this verbatim; a blank value renders an empty error
          error_message: Password must be at least 12 characters and hard to guess. A short phrase of a few unrelated words works well.

      # Fails closed: if api.pwnedpasswords.com is unreachable no password can be set.
      # Unbind this from recovery-password-prompt if that ever locks someone out.
      - model: authentik_policies_password.passwordpolicy
        identifiers: { name: password-breached }
        state: present
        attrs:
          check_static_rules: false
          check_zxcvbn: false
          check_have_i_been_pwned: true
          hibp_allowed_count: 0
