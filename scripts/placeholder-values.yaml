# Stand-ins for the flux-values and flux-secrets variables the clusters
# substitute, used by build-manifests.py. Every variable a manifest uses without
# a default needs an entry here, or the build fails. Values are strings, as in
# Flux, but they are substituted before YAML is parsed, so "false" and "1"
# arrive as a boolean and an integer.

# flux-values. Typed to match how each is used: IPs, hosts and domains are
# reserved example addresses, backup_paused is a boolean, the TrueNAS group IDs
# are integers.
vals_apps_dns_authoritative_ipAddress: "192.0.2.11"
vals_apps_games_shared_ipAddress: "192.0.2.12"
vals_apps_mail_dovecot_ipAddress: "192.0.2.13"
vals_apps_mail_postfix_ipAddress: "192.0.2.14"
vals_apps_mail_postfix_relayHost: "relay.example.com"
vals_apps_mail_postfix_virtualDomains: "example.net"
vals_info_cluster_domain: "example.com"
vals_info_cluster_email: "admin@example.com"
vals_info_cluster_name: "ci"
vals_info_cluster_publicHost: "ingress.example.com"
vals_infra_certManager_issuer: "placeholder-issuer"
vals_infra_ingress_ipAddress: "192.0.2.10"
vals_infra_metallb_ipAddressPool: "192.0.2.0/24"
vals_infra_storage_backup_paused: "false"
vals_infra_storage_backup_s3Endpoint: "s3.example.com"
vals_infra_storage_truenas_host: "nas.example.com"
vals_infra_storage_truenas_iscsiInitiatorGroupId: "1"
vals_infra_storage_truenas_iscsiPortal: "192.0.2.20:3260"
vals_infra_storage_truenas_iscsiPortalGroupId: "1"
vals_infra_storage_truenas_nfsServer: "192.0.2.21"

