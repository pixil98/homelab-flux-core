# A copy of CNPG's official catalog (cloudnative-pg/artifacts,
# image-catalogs/catalog-system-trixie.yaml), trimmed to the majors in use and
# using the floating minor tag so Renovate can bump it. Clusters that point at
# an entry roll to its image whenever the entry changes.
apiVersion: postgresql.cnpg.io/v1
kind: ClusterImageCatalog
metadata:
  name: postgresql-system-trixie
spec:
  images:
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:b4bbd2e623f1a8833e9a2a4210480ef215b6d13fc0988b06786a778a5c699a20
