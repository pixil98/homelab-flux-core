apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: storage
spec:
  releaseName: volsync
  chart:
    spec:
      chart: volsync
      sourceRef:
        kind: HelmRepository
        name: backube
      version: "0.17.0"
      interval: 6h
  interval: 30m
  install:
    remediation:
      retries: 3
  values:
    manageCRDs: true
    # The chart's ServiceMonitor sends no bearer token, so with RBAC-protected
    # metrics every scrape is a 401. The endpoint is in-cluster only.
    metrics:
      disableAuth: true
