# Holds one key per friend (<username-key>.json, a complete AccountsSettings.json), written by
# the libation-register app and mounted into the libation CronJob at /accounts.
#
# Flux only creates this; it never overwrites or prunes it, since the data is written by the
# app and lives nowhere else.
apiVersion: v1
kind: Secret
metadata:
  name: libation-accounts
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
