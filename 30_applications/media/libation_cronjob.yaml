apiVersion: batch/v1
kind: CronJob
metadata:
  name: libation
  namespace: media
spec:
  schedule: "0 0 * * 0"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retries re-enter Libation's deregister path, which is destructive.
      backoffLimit: 0
      template:
        spec:
          # Accounts arrive as a mounted Secret, so the job needs no Kubernetes API access.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
          - name: libation
            image: docker.io/rmcrackan/libation:14.2.2
            imagePullPolicy: Always
            args:
              - /bin/bash
              - /scripts/run.sh
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            volumeMounts:
            - name: data
              mountPath: /data
            - name: settings
              mountPath: /config/Settings.json
              subPath: "Settings.json"
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: accounts
              mountPath: /accounts
              readOnly: true
            - name: db-local
              mountPath: /db
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: settings
            configMap:
              name: libation-settings
          - name: scripts
            configMap:
              name: libation-config-scripts
              defaultMode: 0755
          # One <user>.json file per friend, written by libation-register.
          - name: accounts
            secret:
              secretName: libation-accounts
          - name: data
            persistentVolumeClaim:
              claimName: audible-pvc
          - name: db-local
            emptyDir: {}
          - name: tmp
            emptyDir: {}
