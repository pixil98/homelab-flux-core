apiVersion: batch/v1
kind: CronJob
metadata:
  name: libation
  namespace: media
spec:
  schedule: "0 0 * * 0"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retries re-enter Libation's deregister path, which is destructive.
      backoffLimit: 0
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
          - name: libation
            image: docker.io/rmcrackan/libation:13.7.7
            imagePullPolicy: Always
            args:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                /libation/LibationCli scan
                /libation/LibationCli set-status -d
                /libation/LibationCli liberate
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            volumeMounts:
            - name: data
              mountPath: /data
            - name: settings
              mountPath: /config/Settings.json
              subPath: "Settings.json"
            - name: accounts
              mountPath: /config/AccountsSettings.json
              subPath: "AccountsSettings.json"
            - name: db-local
              mountPath: /db
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: settings
            configMap:
              name: libation-settings
          - name: accounts
            secret:
              secretName: libation-accounts
          - name: data
            persistentVolumeClaim:
              claimName: audible-pvc
          - name: db-local
            emptyDir: {}
          - name: tmp
            emptyDir: {}
