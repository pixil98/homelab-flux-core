apiVersion: batch/v1
kind: CronJob
metadata:
  name: libation
  namespace: media
spec:
  schedule: "0 0 * * 0"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retries re-enter Libation's deregister path, which is destructive.
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: libation
          # Scoped to the initContainer via the kube-api-access volume below, so the
          # Libation container itself has no API access.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          initContainers:
          # Writes every Secret labelled libation.homelab/account=true into /accounts as
          # namespace_media.secret_<secret-name>.<key>, one file per key.
          - name: load-accounts
            image: quay.io/kiwigrid/k8s-sidecar:2.10.1
            imagePullPolicy: IfNotPresent
            env:
            - name: LABEL
              value: libation.homelab/account
            - name: LABEL_VALUE
              value: "true"
            - name: FOLDER
              value: /accounts
            - name: RESOURCE
              value: secret
            - name: METHOD
              value: LIST
            - name: NAMESPACE
              value: media
            - name: UNIQUE_FILENAMES
              value: "true"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 256Mi
            volumeMounts:
            - name: accounts
              mountPath: /accounts
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          containers:
          - name: libation
            image: docker.io/rmcrackan/libation:13.7.10
            imagePullPolicy: Always
            args:
              - /bin/bash
              - /scripts/run.sh
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            volumeMounts:
            - name: data
              mountPath: /data
            - name: settings
              mountPath: /config/Settings.json
              subPath: "Settings.json"
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: accounts
              mountPath: /accounts
              readOnly: true
            - name: db-local
              mountPath: /db
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: settings
            configMap:
              name: libation-settings
          - name: scripts
            configMap:
              name: libation-config-scripts
              defaultMode: 0755
          - name: accounts
            emptyDir: {}
          - name: kube-api-access
            projected:
              sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
              - downwardAPI:
                  items:
                  - path: namespace
                    fieldRef:
                      fieldPath: metadata.namespace
          - name: data
            persistentVolumeClaim:
              claimName: audible-pvc
          - name: db-local
            emptyDir: {}
          - name: tmp
            emptyDir: {}
