# Only authentik-server, where the outpost proxying the app runs, needs to reach the pod. The app
# checks every request's access token with Authentik itself, so this is defence in depth: the
# cluster's CNI (Talos's default Flannel) doesn't enforce NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: libation-register
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: libation-register
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 8080
