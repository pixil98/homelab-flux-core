# Each Audible account is its own Secret, discovered by label rather than by name
# and merged into AccountsSettings.json at job start (see libation_cronjob.yaml).
# Account data stays out of git, so there is nothing to apply from this file.
#
# To add or re-auth one account, sign in with Libation so it writes an
# AccountsSettings.json holding just that account, then:
#
#   kubectl -n media create secret generic libation-account-<name> \
#     --from-file=account.json=./AccountsSettings.json \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n media label --overwrite secret libation-account-<name> \
#     libation.homelab/account=true
#
# Re-running those two commands replaces one person's account without touching
# anyone else's. Dropping an account is a plain `kubectl delete secret`.
