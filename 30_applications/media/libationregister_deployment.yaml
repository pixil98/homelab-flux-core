apiVersion: apps/v1
kind: Deployment
metadata:
  name: libation-register
  namespace: media
  labels:
    app.kubernetes.io/name: libation-register
spec:
  # In-progress sign-ups live in the single gunicorn worker's memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: libation-register
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libation-register
    spec:
      serviceAccountName: libation-register
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: libation-register
          # Built FROM docker.io/rmcrackan/libation; keep its Libation version in step with
          # the libation CronJob's image tag.
          image: ghcr.io/pixil98/libation-signup:0.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SECRET_NAME
              value: libation-accounts
            # Each request's user comes from asking Authentik about the outpost's access token.
            - name: AUTHENTIK_USERINFO_URL
              value: http://authentik-server.auth.svc.cluster.local/application/o/userinfo/
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            # Each sign-up in progress is its own LibationCli (.NET) process.
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            # Per-sign-up LibationFiles dirs, holding plaintext tokens until they're saved.
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        # Memory-backed so tokens never touch node disk.
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
