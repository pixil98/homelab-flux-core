apiVersion: v1
kind: ServiceAccount
metadata:
  name: libation-register
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: libation-register
  namespace: media
# Only the shared accounts Secret, which must already exist (resourceNames can't restrict
# create). A PATCH response returns the whole Secret anyway, so get adds no exposure; it's
# used to show a friend when their login was last saved.
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - libation-accounts
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: libation-register
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: libation-register
subjects:
  - kind: ServiceAccount
    name: libation-register
    namespace: media
