apiVersion: v1
kind: ServiceAccount
metadata:
  name: libation
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: libation
  namespace: media
# RBAC cannot filter by label, so reading the per-account Secrets means reading
# every Secret in the namespace. The token is projected only into the
# account-loading initContainer, never into the Libation container itself.
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: libation
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: libation
subjects:
  - kind: ServiceAccount
    name: libation
    namespace: media
