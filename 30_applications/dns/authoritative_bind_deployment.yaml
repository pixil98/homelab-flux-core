apiVersion: apps/v1
kind: Deployment
metadata:
  name: authoritative-bind
  namespace: dns
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: authoritative-bind
spec:
  replicas: ${vals_apps_dns_authoritative_replicas:=1}
  selector:
    matchLabels:
      app.kubernetes.io/name: authoritative-bind
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authoritative-bind
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-zones
          image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command: ["/bin/sh", "-c"]
          args: ["cp /configtmp/* /config"]
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: zones
              mountPath: /configtmp
            - name: var-lib-bind
              mountPath: /config
      containers:
        - name: bind9
          image: "docker.io/internetsystemsconsortium/bind9:9.20@sha256:66092edb53c081fa11b1fa8219e99065b0f497cb38f568ba789702a4c10e2590"
          imagePullPolicy: Always
          command: ["/usr/sbin/named"]
          args: ["-g", "-c", "/etc/bind/named.conf", "-u", "bind"]
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-rndc
              containerPort: 953
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "125Mi"
              cpu: "15m"
            limits:
              memory: "175Mi"
              cpu: "25m"
          volumeMounts:
            - name: config
              mountPath: /etc/bind
            - name: var-lib-bind
              mountPath: /var/lib/bind
            - name: working-dir
              mountPath: /var/cache/bind
            - name: logs
              mountPath: /var/log
        - name: metrics-exporter
          image: docker.io/prometheuscommunity/bind-exporter:v0.8.0@sha256:f3d3d3c85e95e752a2af50c46cebeaeee22d94493d7d7c898e2ab9d232b366d7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command: ["/bin/bind_exporter"]
          args:
            - "--bind.stats-url=http://127.0.0.1:8053"
            - "--bind.stats-groups=server,view"
          ports:
            - name: monitoring
              containerPort: 9119
              protocol: TCP
          resources:
            requests:
              memory: "125Mi"
              cpu: "15m"
            limits:
              memory: "175Mi"
              cpu: "25m"
      volumes:
        - name: config
          projected:
            sources:
              - secret:
                  name: authoritative-bind-letsencrypt-keys
              - configMap:
                  name: authoritative-bind-config
        - name: zones
          configMap:
            name: authoritative-bind-zones
        - name: var-lib-bind
          emptyDir: {}
        - name: working-dir
          emptyDir: {}
        - name: logs
          emptyDir: {}
