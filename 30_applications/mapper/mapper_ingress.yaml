apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mapper
  namespace: mapper
  labels:
    app.kubernetes.io/instance: mapper
  annotations:
    #TODO: This shouldn't be hard coded, it will be used in dev clusters unnecessarily
    cert-manager.io/cluster-issuer: letsencrypt-production-cloudflare
    external-dns.alpha.kubernetes.io/target: ${vals_info_cluster_publicHost}
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # A person import holds the connection open while the server ingests the
    # payload, which runs past the 60s default and returns 504 to the client.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mapper.${secrets_apps_mapper_mapper_domain}
      secretName: mapper-tls
  rules:
    - host: mapper.${secrets_apps_mapper_mapper_domain}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mapper-server
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mapper-client
                port:
                  name: http
