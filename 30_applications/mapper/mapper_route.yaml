apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mapper
  namespace: mapper
  labels:
    app.kubernetes.io/instance: mapper
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingress
      namespace: ingress
      sectionName: https
  hostnames:
    - "mapper.${secrets_apps_mapper_mapper_domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      timeouts:
        request: 10m
      backendRefs:
        - group: ""
          kind: Service
          name: mapper-server
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 2m
      backendRefs:
        - group: ""
          kind: Service
          name: mapper-client
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mapper-request-buffer
  namespace: mapper
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mapper
  requestBuffer:
    limit: 50Mi
  # nginx's proxy-read-timeout was an inactivity timeout, so keep Envoy's
  # equivalent in addition to the finite request budgets on the route rules.
  timeout:
    http:
      streamIdleTimeout: 300s
