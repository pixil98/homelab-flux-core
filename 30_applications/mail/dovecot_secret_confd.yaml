apiVersion: v1
kind: Secret
metadata:
  name: dovecot-custom-ext
  namespace: mail
type: Opaque
stringData:
  auth-oauth2.conf.ext: |
    auth_mechanisms {
      xoauth2 = yes
      oauthbearer = yes
    }

    oauth2 {
      tokeninfo_url = https://auth.${vals_info_cluster_domain}/application/o/userinfo/?access_token=
      introspection_url = https://${secrets_apps_auth_applications_dovecot_clientId}:${secrets_apps_auth_applications_dovecot_clientSecret}@auth.${vals_info_cluster_domain}/application/o/introspect/
      introspection_mode = post
      force_introspection = yes
      active_attribute = active
      active_value = true
      username_attribute = email
    }

    # with local validation
    #oauth2 {
    #  introspection_mode = local
    #  username_attribute = email
    #  oauth2_local_validation {
    #    dict fs {
    #      fs posix {
    #        prefix = /etc/dovecot/oauth2-keys/
    #      }
    #    }
    #  }
    #}

  auth-ldap.conf.ext: |
    # Authentication for LDAP users. Included from auth.conf.
    #
    # <https://doc.dovecot.org/latest/core/config/auth/databases/ldap.html>

    ## See <https://doc.dovecot.org/latest/core/config/dict.html#ldap>
    
    ldap_uris = ldap://authentik-outpost-ldap.auth.svc.cluster.local
    ldap_auth_dn = cn=service-ldap,ou=users,dc=ldap,dc=goauthentik,dc=io
    ldap_auth_dn_password = ${secrets_apps_auth_authentik_outpost_ldap_password}
    ldap_base = dc=ldap,dc=goauthentik,dc=io

    # Lookups that don't check a password, e.g. doveadm auth lookup.
    passdb ldap-lookup {
      driver = ldap
      mechanisms_filter = lookup
      ldap_filter = (&(cn=%{user})(objectClass=user)(memberOf=cn=mail-users,ou=groups,dc=ldap,dc=goauthentik,dc=io)(ak-active=true))
      ldap_bind = yes
    }

    # Password logins search and bind on separate connections. Every authentik
    # bind runs its login flow and takes seconds, and a bind leaves the
    # connection bound as the user, so a search on the same connection has to
    # rebind as service-ldap first. Doing both on one connection put a login at
    # ~10s, which is postfix's fixed SASL timeout. Apart, neither has to rebind
    # between logins.
    #
    # Step 1: only mail users get past this. It doesn't check the password, and
    # its result is never cached, so every password login searches. Fail on
    # errors too: by default an internal failure continues to step 2, which
    # would accept any account authentik lets bind, mail user or not.
    passdb ldap {
      mechanisms_filter = plain login
      ldap_filter = (&(cn=%{user})(objectClass=user)(memberOf=cn=mail-users,ou=groups,dc=ldap,dc=goauthentik,dc=io)(ak-active=true))
      fields {
        noauthenticate = yes
      }
      result_failure = return-fail
      result_internalfail = return-fail
    }

    # Step 2: check the password with a bind on a connection that does nothing
    # else. The DN template skips the search, so the filter is ignored, but
    # Dovecot refuses an ldap passdb without one. %{user} can't break out of the
    # DN: auth_username_chars only allows letters, digits and .-_@
    passdb ldap-bind {
      driver = ldap
      mechanisms_filter = plain login
      ldap_filter = (&(cn=%{user})(objectClass=user)(memberOf=cn=mail-users,ou=groups,dc=ldap,dc=goauthentik,dc=io)(ak-active=true))
      ldap_bind = yes
      ldap_bind_userdn = cn=%{user},ou=users,dc=ldap,dc=goauthentik,dc=io
      ldap_connection_group = auth-bind
    }

    # "prefetch" user database means that the passdb already provided the
    # needed information and there's no need to do a separate userdb lookup.
    # <https://doc.dovecot.org/latest/core/config/auth/databases/prefetch.html>
    #userdb prefetch {
    #}

    userdb ldap {
      ldap_filter = (&(cn=%{user})(objectClass=user)(memberOf=cn=mail-users,ou=groups,dc=ldap,dc=goauthentik,dc=io)(ak-active=true))

      # Default fields can be used to specify defaults that LDAP may override
      fields {
        uid = vmail
        gid = vmail
        home = /var/vmail/%{ldap:mail | domain}/%{ldap:mail | username}
      }
    }

    # If you don't have any user-specific settings, you can avoid the userdb LDAP
    # lookup by using userdb static instead of userdb ldap, for example:
    # <https://doc.dovecot.org/latest/core/config/auth/databases/static.html>
    #userdb static {
      #fields {
      #  uid = vmail
      #  gid = vmail
      #  home = /var/vmail/%{user}
      #}
    #}

  auth-static.conf.ext: |
    # Static passdb. Included from auth.conf.

    # This can be used for situations where Dovecot doesn't need to verify the
    # username or the password, or if there is a single password for all users:
    #
    #  - proxy frontend, where the backend verifies the password
    #  - proxy backend, where the frontend already verified the password
    #  - authentication with SSL certificates
    #  - simple testing
    # 
    # Each passdb must have unique name, but if you only use it once per driver
    # you can use driver name as passdb/userdb section name.

    #passdb static {
    #  fields {
    #    proxy = y
    #    host = %{user|md5|substr(1)}.example.com
    #    nopassword = y
    #  }
    #}

    #passdb static2 {
    #  driver = static
    #  fields {
    #    password = test
    #  }
    #}

    #userdb static {
    #  fields {
    #    uid = vmail
    #    gid = vmail
    #    home = /var/vmail/%{user | domain}/%{user | username}
    #  }
    #}
