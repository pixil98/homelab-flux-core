apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: rspamd-dragonfly
  namespace: mail
spec:
    authentication:
      passwordFromSecret:
        name: rspamd-redis-password
        key: password
    replicas: 1
    # rspamd's bayes scripts touch keys they haven't declared, which dragonfly
    # rejects by default -- the classifier can't read or write its stats without
    # this and scores nothing.
    args:
      - "--default_lua_flags=allow-undeclared-keys"
---
apiVersion: v1
kind: Secret
metadata:
  name: rspamd-redis-password
  namespace: mail
type: Opaque
stringData:
  password: ${secrets_apps_mail_rspamd_redisPassword}