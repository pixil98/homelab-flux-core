apiVersion: v1
kind: Secret
metadata:
  name: roundcube-server-config
  namespace: mail
type: Opaque
stringData:
  connections.php: |
    <?php
      $_SERVER['HTTPS'] = 'on';
      $config['imap_conn_options'] = array(
              'ssl' => array(
                'peer_name' => 'mail.${vals_info_cluster_domain}',
                'verify_peer' => true,
                'verify_peer_name' => true,
                'allow_self_signed' => true,
              ),
              'tls' => array(
                'peer_name' => 'mail.${vals_info_cluster_domain}',
                'verify_peer' => true,
                'verify_peer_name' => true,
                'allow_self_signed' => true,
              ),
      );
      $config['smtp_conn_options'] = array(
              'ssl' => array(
                'peer_name' => 'mail.${vals_info_cluster_domain}',
                'verify_peer' => true,
                'verify_peer_name' => true,
                'allow_self_signed' => true,
              ),
              'tls' => array(
                'peer_name' => 'mail.${vals_info_cluster_domain}',
                'verify_peer' => true,
                'verify_peer_name' => true,
                'allow_self_signed' => true,
              ),
      );
    ?>
  logging.php: |
    <?php
      $config['smtp_log'] = false;
      $config['log_logins'] = true;
      $config['session_debug'] = false;
      $config['sql_debug'] = false;
      $config['imap_debug'] = false;
      $config['ldap_debug'] = false;
      $config['smtp_debug'] = false;
      $config['memcache_debug'] = false;
      $config['apc_debug'] = false;
      $config['redis_debug'] = false;
      $config['oauth_debug'] = false;
    ?>
  session.php: |
    <?php
      $config['session_lifetime'] = 1440;
    ?>
  oauth.php: |
    <?php
      $config['oauth_provider'] = 'generic';
      $config['oauth_provider_name'] = 'Authentik';
      $config['oauth_client_id'] = '${secrets_apps_auth_applications_dovecot_clientId}';
      $config['oauth_client_secret'] = '${secrets_apps_auth_applications_dovecot_clientSecret}';
      // Discovery supplies the auth/token/userinfo/logout endpoints plus issuer and
      // JWKS (enabling ID token validation). Cached so it isn't fetched per request.
      $config['oauth_config_uri'] = 'https://auth.${vals_info_cluster_domain}/application/o/mail/.well-known/openid-configuration';
      $config['oauth_cache'] = 'db';
      $config['oauth_scope'] = "email openid dovecot_profile offline_access";
      $config['oauth_auth_parameters'] = [];
      $config['oauth_identity_fields'] = ['email'];
      $config['oauth_login_redirect'] = true;
    ?>
