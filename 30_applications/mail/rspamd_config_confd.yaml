apiVersion: v1
kind: Secret
metadata:
  name: rspamd-config-confd
  namespace: mail
type: Opaque
stringData:
  classifier-bayes.conf: |
    backend = "redis";
    # The table form goes through lua_bayes_learn: spam is reject with >1
    # positive symbol (or add header with >2), ham is no action with a negative
    # score or >3 negative symbols. `autolearn = true` would also learn our own
    # outbound mail.
    autolearn {
      learn_verdict = true;
      # check_* mean "include", and both default to true
      check_authed = false;
      check_local = false;
      # keep spam and ham learns within ~10% of each other
      check_balance = true;
      min_balance = 0.9;
    }
    # Turns on bayes_expiry; without it tokens are kept forever.
    expiry = 90d;
  milter_headers.conf: |
    use = ["x-spamd-bar", "x-spam-level", "authentication-results"];
    extended_spam_headers = true;
    skip_local = false;
    skip_authenticated = true;
  phishing.conf: |
    # local.d files merge into the module's own section, so a phishing { }
    # wrapper here nests it as phishing.phishing and rspamd silently ignores it.
    openphish_enabled = true;
  redis.conf: |
    servers = "rspamd-dragonfly";
    password = "${secrets_apps_mail_rspamd_redisPassword}";
  # File/Path/Shm inputs let a client make rspamd read and disclose any file it
  # can read (e.g. redis.conf). Every worker listens on TCP and the service is
  # reachable cluster-wide, and nothing here passes messages by file.
  worker-controller.inc: |
    allow_file_and_shm_inputs = false;
  worker-normal.inc: |
    allow_file_and_shm_inputs = false;
  worker-proxy.inc: |
    allow_file_and_shm_inputs = false;
    milter = yes;
    upstream "local" {
      default = yes;
      self_scan = yes;
    }
