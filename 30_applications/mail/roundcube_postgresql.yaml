apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: roundcube-postgresql
  namespace: mail
spec:
  instances: 1

  # Image comes from 10_infrastructure/configs/cnpg-system, where Renovate bumps it.
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-system-trixie
    major: 18

  # Light tuning for webmail workload
  postgresql:
    parameters:
      # Moderate autovacuum for session table churn
      autovacuum_naptime: "60s"
      autovacuum_vacuum_scale_factor: "0.1"

      # Basic performance tuning
      shared_buffers: "128MB"
      effective_cache_size: "2GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"

  superuserSecret:
    name: roundcube-postgresql-superuser

  # Restored on 2026-11-18 from the archive of the cluster Flux deleted and
  # recreated (bootstrap only runs when the cluster is created). That archive
  # isn't empty, so CNPG won't archive into it again: WAL and backups now go
  # under a new serverName.
  bootstrap:
    recovery:
      source: roundcube-postgresql-20261118
      database: roundcube
      owner: roundcube
      secret:
        name: roundcube-postgresql-appuser

  externalClusters:
    - name: roundcube-postgresql-20261118
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-backup
          serverName: roundcube-postgresql

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup
        serverName: roundcube-postgresql-2

  storage:
    storageClass: truenas-iscsi
    size: 15Gi
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup
  namespace: mail
spec:
  configuration:
    destinationPath: "s3://${vals_info_cluster_name}/cnpg/"
    endpointURL: "${vals_infra_storage_backup_s3Endpoint}"
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-credentials
        key: SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
  retentionPolicy: "30d"
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-credentials
  namespace: mail
type: Opaque
stringData:
  ACCESS_KEY_ID: "${secrets_infra_storage_backup_awsAccessKeyId}"
  SECRET_ACCESS_KEY: "${secrets_infra_storage_backup_awsSecretAccessKey}"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: roundcube-postgresql-backup
  namespace: mail
spec:
  suspend: ${vals_infra_storage_backup_paused}
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: roundcube-postgresql
---
apiVersion: v1
kind: Secret
metadata:
  name: roundcube-postgresql-appuser
  namespace: mail
type: kubernetes.io/basic-auth
stringData:
  username: roundcube
  password: ${secrets_apps_mail_roundcube_postgresql_app_password}
---
apiVersion: v1
kind: Secret
metadata:
  name: roundcube-postgresql-superuser
  namespace: mail
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: ${secrets_apps_mail_roundcube_postgresql_superuser_password}
