apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: romm-dragonfly
  namespace: games
spec:
  authentication:
    passwordFromSecret:
      name: romm-redis-password
      key: password
  replicas: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: romm-redis-password
  namespace: games
type: Opaque
stringData:
  password: ${secrets_apps_games_romm_redisPassword}
