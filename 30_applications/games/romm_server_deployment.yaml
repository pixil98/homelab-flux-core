apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm-server
  namespace: games
  labels:
    app.kubernetes.io/name: romm
    app.kubernetes.io/instance: romm
    app.kubernetes.io/component: server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
      app.kubernetes.io/instance: romm
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
        app.kubernetes.io/instance: romm
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: romm
          image: ghcr.io/rommapp/romm:5.2.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: America/Chicago
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: auth-secret-key
            - name: ROMM_DB_DRIVER
              value: postgresql
            - name: DB_HOST
              value: romm-postgresql-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: romm
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-appuser
                  key: username
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-postgresql-appuser
                  key: password
            - name: REDIS_HOST
              value: romm-dragonfly
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-redis-password
                  key: password
            - name: ROMM_BASE_URL
              value: "https://romm.${vals_info_cluster_domain}"
            - name: ROMM_SESSION_SECURE_COOKIE
              value: "true"
            - name: IGDB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: igdb-client-id
            - name: IGDB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: igdb-client-secret
            - name: SCREENSCRAPER_USER
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: screenscraper-user
            - name: SCREENSCRAPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: screenscraper-password
            - name: MOBYGAMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: mobygames-api-key
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: PLAYMATCH_API_ENABLED
              value: "true"
            - name: TGDB_API_ENABLED
              value: "true"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_PROVIDER
              value: authentik
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm-secrets
                  key: oidc-client-secret
            - name: OIDC_SERVER_APPLICATION_URL
              value: "https://auth.${vals_info_cluster_domain}/application/o/romm"
            - name: OIDC_REDIRECT_URI
              value: "https://romm.${vals_info_cluster_domain}/api/oauth/openid"
            - name: OIDC_ALLOW_REGISTRATION
              value: "true"
            - name: OIDC_AUTOLOGIN
              value: "true"
            - name: OIDC_CLAIM_ROLES
              value: groups
            - name: OIDC_ROLE_VIEWER
              value: romm
            - name: OIDC_ROLE_ADMIN
              value: authentik Admins
            - name: DISABLE_USERPASS_LOGIN
              value: "true"
            - name: DISABLE_SETUP_WIZARD
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /romm/config
              readOnly: true
            - name: library
              mountPath: /romm/library
            - name: assets
              mountPath: /romm/assets
            - name: resources
              mountPath: /romm/resources
      volumes:
        - name: config
          configMap:
            name: romm-config
        - name: library
          persistentVolumeClaim:
            claimName: romm-library
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
