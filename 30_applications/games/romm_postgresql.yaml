apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-postgresql
  namespace: games
spec:
  instances: 1

  superuserSecret:
    name: romm-postgresql-superuser

  bootstrap:
    initdb:
      database: romm
      owner: romm
      secret:
        name: romm-postgresql-appuser

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backup

  storage:
    storageClass: truenas-iscsi
    size: 15Gi
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup
  namespace: games
spec:
  configuration:
    destinationPath: "s3://${vals_info_cluster_name}/cnpg/"
    endpointURL: "${vals_infra_storage_backup_s3Endpoint}"
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-credentials
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
  retentionPolicy: "30d"
---
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-credentials
  namespace: games
type: Opaque
stringData:
  ACCESS_KEY_ID: "${secrets_infra_storage_backup_awsAccessKeyId}"
  SECRET_ACCESS_KEY: "${secrets_infra_storage_backup_awsSecretAccessKey}"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: romm-postgresql-backup
  namespace: games
spec:
  suspend: ${vals_infra_storage_backup_paused}
  schedule: "0 3 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: romm-postgresql
---
apiVersion: v1
kind: Secret
metadata:
  name: romm-postgresql-appuser
  namespace: games
type: kubernetes.io/basic-auth
stringData:
  username: romm
  password: ${secrets_apps_games_romm_postgresql_app_password}
---
apiVersion: v1
kind: Secret
metadata:
  name: romm-postgresql-superuser
  namespace: games
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: ${secrets_apps_games_romm_postgresql_superuser_password}
