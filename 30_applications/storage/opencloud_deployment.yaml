apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-server
  namespace: storage
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: "opencloud"
    app.kubernetes.io/instance: "opencloud"
    app.kubernetes.io/component: "server"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: "opencloud"
      app.kubernetes.io/instance: "opencloud"
      app.kubernetes.io/component: "server"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "opencloud"
        app.kubernetes.io/instance: "opencloud"
        app.kubernetes.io/component: "server"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencloud
          image: docker.io/opencloudeu/opencloud-rolling:8.0.1
          imagePullPolicy: IfNotPresent
          # The image has no init container step of its own: config/certs/admin
          # user are bootstrapped on first boot into the persisted config volume.
          # Re-running init on every start is a documented no-op once bootstrapped.
          command: ["/bin/sh"]
          args: ["-c", "opencloud init || true; opencloud server"]
          env:
            - name: OC_URL
              value: "https://drive.${vals_info_cluster_domain}"
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-secrets
                  key: admin-password

            # OIDC (Authentik as the sole login path)
            - name: OC_OIDC_ISSUER
              value: "https://auth.${vals_info_cluster_domain}/application/o/opencloud/"
            - name: IDP_DOMAIN
              value: "auth.${vals_info_cluster_domain}"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: "jwt"
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: OC_EXCLUDE_RUN_SERVICES
              value: "idp"
            # Configures the web SPA's own OIDC client so it knows to redirect
            # to the IdP; WEBFINGER_* below only serves the discovery endpoint
            # used by desktop/mobile clients, not the web frontend itself.
            - name: WEB_OIDC_CLIENT_ID
              value: "${secrets_apps_auth_applications_opencloud_clientId}"
            - name: WEB_OIDC_SCOPE
              value: "openid profile email"
            - name: WEBFINGER_WEB_OIDC_CLIENT_ID
              value: "${secrets_apps_auth_applications_opencloud_clientId}"
            - name: WEBFINGER_WEB_OIDC_CLIENT_SCOPES
              value: "openid profile email"
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "default"
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1.5Gi"
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: http
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            tcpSocket:
              port: http
            timeoutSeconds: 1
          startupProbe:
            # First boot runs `opencloud init` (cert + service account generation)
            # before the server binds, which can take a few minutes.
            failureThreshold: 60
            initialDelaySeconds: 0
            periodSeconds: 5
            tcpSocket:
              port: http
            timeoutSeconds: 1
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
            - name: config
              mountPath: /etc/opencloud
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
