apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-csp
  namespace: storage
data:
  csp.yaml: |
    # Default policy from opencloud-eu/opencloud services/proxy/pkg/config/csp.yaml,
    # with the Authentik origin added to connect-src so the web SPA can fetch the
    # OIDC discovery document instead of silently failing the CSP check and hanging
    # on the login spinner.
    directives:
      child-src:
        - "'self'"
      connect-src:
        - "'self'"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
        - "https://update.opencloud.eu/"
        - "https://auth.${vals_info_cluster_domain}"
      default-src:
        - "'none'"
      font-src:
        - "'self'"
      frame-ancestors:
        - "'self'"
      frame-src:
        - "'self'"
        - "blob:"
        - "https://embed.diagrams.net/"
      img-src:
        - "'self'"
        - "data:"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
      manifest-src:
        - "'self'"
      media-src:
        - "'self'"
      object-src:
        - "'self'"
        - "blob:"
      script-src:
        - "'self'"
        - "'unsafe-inline'"
      style-src:
        - "'self'"
        - "'unsafe-inline'"
        - "blob:"
