apiVersion: v1
kind: Secret
metadata:
  name: authentik-blueprint-opencloud
  namespace: auth
  labels:
    goauthentik.io/blueprint: "true"
type: Opaque
stringData:
  opencloud.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: Custom - OpenCloud
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: opencloud_provider
        identifiers: { name: opencloud }
        state: present
        attrs:
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          # Implicit consent: opencloud is our own app, so don't prompt to authorize it.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # OpenCloud's web client is a public SPA using authorization_code + PKCE, no client secret.
          client_type: public
          grant_types:
            - authorization_code
          client_id: ${secrets_apps_auth_applications_opencloud_clientId}
          redirect_uris:
            - { matching_mode: strict, url: "https://drive.${vals_info_cluster_domain}/oidc-callback.html" }
            - { matching_mode: strict, url: "https://drive.${vals_info_cluster_domain}/oidc-silent-redirect.html" }
            - { matching_mode: strict, url: "https://drive.${vals_info_cluster_domain}/" }
          access_code_validity: minutes=1
          access_token_validity: minutes=30
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, auth.${vals_info_cluster_domain}]]
          # OpenCloud's proxy service exposes a backchannel logout endpoint natively;
          # no extra config needed on the OpenCloud side.
          logout_uri: "https://drive.${vals_info_cluster_domain}/backchannel_logout"
          logout_method: backchannel
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      - model: authentik_core.application
        id: opencloud_app
        identifiers: { slug: opencloud }
        state: present
        attrs:
          name: OpenCloud
          slug: opencloud
          provider: !KeyOf opencloud_provider
          meta_launch_url: https://drive.${vals_info_cluster_domain}/
          icon: icons/opencloud.svg
          policy_engine_mode: any

      - model: authentik_core.group
        id: opencloud_group
        identifiers: { name: opencloud }
        state: present
        attrs: { name: opencloud }

      # Members get the OpenCloud "admin" role via PROXY_ROLE_ASSIGNMENT_DRIVER=oidc
      # (see opencloud_proxy_role_mapping_configmap.yaml), separate from Authentik's
      # own "authentik Admins" superuser group.
      - model: authentik_core.group
        id: opencloud_admins_group
        identifiers: { name: opencloud-admins }
        state: present
        attrs: { name: opencloud-admins }

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf opencloud_app
          group:  !KeyOf opencloud_group
        attrs: { order: 10 }

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf opencloud_app
          group: !KeyOf opencloud_admins_group
        attrs: { order: 15 }

      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf opencloud_app
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs: { order: 20 }
